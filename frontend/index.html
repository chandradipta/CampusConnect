<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusConnect | Smart Campus Management</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#eeeafb;--card:#fff;--ink:#20114a;--mute:#6b5f94;--line:#20114a;--pink:#ff4fa3;--purple:#7b3fe4;--amber:#ffc93c;--cyan:#2fd9ff;--red:#ff4d5e;--green:#23b39b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;background-image:radial-gradient(#20114a33 1px,transparent 1px);background-size:18px 18px}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:245px;background:linear-gradient(180deg,#20114a,#431b7c);color:#fff;padding:18px 13px;display:flex;flex-direction:column;z-index:5}.brand{font-family:'Press Start 2P';font-size:10px;line-height:1.6;display:flex;gap:10px;align-items:center;padding:6px 8px 20px}.brand-dot{width:34px;height:34px;border:2px solid var(--pink);background:var(--amber);box-shadow:3px 3px 0 var(--pink);transform:rotate(3deg)}.user-mini{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #ffffff33;border-radius:10px;margin-bottom:12px}.avatar{width:42px;height:42px;border-radius:50%;background:var(--pink);color:var(--ink);display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#ddd6f5;text-align:left;padding:11px 12px;border-radius:7px}.nav button:hover{background:#ffffff12;transform:translateX(3px)}.nav button.active{background:var(--amber);color:var(--ink);box-shadow:3px 3px 0 var(--pink);font-weight:700}.logout{margin-top:auto;background:var(--red)!important;color:#fff!important;border:2px solid var(--ink)!important;box-shadow:3px 3px 0 var(--ink)}main{margin-left:245px;max-width:1150px;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{font-family:'Press Start 2P';font-size:18px;line-height:1.5;margin:0}.icon-btn{border:2px solid var(--line);background:var(--card);padding:9px 12px;border-radius:8px;box-shadow:3px 3px 0 var(--line)}.card{background:var(--card);border:2px solid var(--line);border-radius:12px;box-shadow:5px 5px 0 var(--line);padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{border:2px solid var(--line);border-radius:10px;padding:15px;background:#fff;min-height:105px}.stat b{display:block;font-family:'Press Start 2P';font-size:18px;margin:6px 0 10px}.stat span{color:var(--mute);font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{margin-bottom:10px}.field label{font-size:13px;color:var(--mute);display:block;margin:0 0 4px}.field input,.field textarea,.field select{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--ink)}.field textarea{resize:vertical}.btn{background:var(--pink);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:700;box-shadow:3px 3px 0 var(--line)}.btn:active{transform:translate(3px,3px);box-shadow:none}.btn.secondary{background:var(--cyan)}.btn.warning{background:var(--amber)}.btn.danger{background:var(--red);color:#fff}.btn.ghost{background:#fff}.pill{display:inline-block;padding:4px 9px;border:2px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;margin-right:4px}.High{background:var(--red);color:#fff}.Medium{background:var(--amber)}.Low{background:#bfe9e2}.status{background:#eeeafb}.ai{border:2px dashed var(--pink);background:#ff4fa312;border-radius:10px;padding:14px;min-height:75px}.bar{height:13px;border:2px solid var(--line);border-radius:7px;overflow:hidden;background:#eeeafb}.bar i{display:block;height:100%;background:var(--pink)}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.muted{color:var(--mute)}.small{font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.issue{border-left:7px solid var(--pink);padding-left:13px}.issue + .issue{margin-top:15px}.timeline{display:flex;gap:4px;margin-top:12px}.step{flex:1;text-align:center;font-size:11px;color:var(--mute)}.step:before{content:'';display:block;height:10px;border-radius:5px;background:#ddd7ef;margin-bottom:5px}.step.done{color:var(--ink);font-weight:700}.step.done:before{background:var(--green)}table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px dashed #aaa0c9;text-align:left;font-size:13px}.notice{border-left:6px solid var(--cyan)}.empty{text-align:center;padding:28px;color:var(--mute)}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.authbox{width:min(960px,100%);display:grid;grid-template-columns:1fr 1fr}.hero{padding:42px;background:linear-gradient(160deg,#20114a,#7b3fe4);color:#fff;border:2px solid var(--line);border-right:0;border-radius:14px 0 0 14px;position:relative;overflow:hidden}.hero h1{font-family:'Press Start 2P';font-size:24px;line-height:1.6}.hero p{max-width:420px;color:#eee}.hero ul{line-height:2}.login{border-radius:0 14px 14px 0}.demo{background:#eeeafb;border:2px dashed var(--line);padding:10px;border-radius:8px;font-size:12px}.toast{position:fixed;left:25px;bottom:22px;background:var(--ink);color:#fff;border:2px solid var(--pink);box-shadow:4px 4px 0 var(--pink);padding:12px 16px;border-radius:8px;z-index:20;opacity:0;transform:translateY(15px);transition:.25s}.toast.show{opacity:1;transform:none}.loading{opacity:.6;pointer-events:none}.two{display:grid;grid-template-columns:2fr 1fr;gap:16px}.kpi{font-size:30px;font-weight:800}.profile-head{display:flex;gap:18px;align-items:center}.profile-head .avatar{width:88px;height:88px;font-size:25px}.notif-dot{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;vertical-align:top}.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{border:2px solid var(--line);padding:12px;border-radius:8px;background:#fff}.slot.taken{opacity:.4;text-decoration:line-through}.slot.mine{background:var(--green);color:#fff}.progress{height:9px;background:#ddd7ef;border-radius:6px;overflow:hidden}.progress i{display:block;height:100%;background:var(--purple)}@media(max-width:800px){.sidebar{position:static;width:auto;height:auto}.brand{padding-bottom:10px}main{margin-left:0;padding:16px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.logout{margin-top:8px}.authbox,.two,.formgrid{grid-template-columns:1fr}.hero{border-right:2px solid var(--line);border-radius:14px 14px 0 0}.login{border-radius:0 0 14px 14px}.top{align-items:flex-start}.slot-grid{grid-template-columns:repeat(2,1fr)}}

.brand{letter-spacing:.5px}.brand:after{content:"_";color:var(--cyan);animation:blink 1s steps(2) infinite}
.stat,.card,.slot,.icon-btn,.btn{transition:transform .15s,box-shadow .15s}.stat:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--pink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}.btn:active{transform:translate(3px,3px);box-shadow:none}
.nav button{border-left:4px solid transparent;transition:transform .15s,background .15s,border-color .15s}.nav button:hover{border-color:var(--pink)}.nav button.active{border-color:#20114a}
.slot:not(.taken):hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--cyan)}
.field input:focus,.field textarea:focus,.field select:focus{outline:0;box-shadow:3px 3px 0 var(--cyan)}
.bar i{background:repeating-linear-gradient(45deg,var(--pink) 0 8px,#ff7fbf 8px 16px)}
.top h1:after{content:"";display:block;width:90px;height:6px;margin-top:10px;background:linear-gradient(90deg,var(--pink),var(--amber),var(--cyan))}
.hero{background:linear-gradient(180deg,#20114a,#4a1d7f 65%,#8a2a8f)}.hero>*{position:relative;z-index:1}.hero svg{display:block;animation:bob 3s ease-in-out infinite}.hero h1{margin:16px 0 12px}
.hero:before{content:"";position:absolute;right:24px;bottom:96px;width:120px;height:120px;border-radius:50%;background:repeating-linear-gradient(0deg,#4a1d7f 0 3px,transparent 3px 12px) bottom/100% 55% no-repeat,linear-gradient(#ffc93c,#ff4fa3);animation:bob 6s ease-in-out infinite}
.hero:after{content:"";position:absolute;left:-40%;right:-40%;bottom:0;height:100px;background-image:linear-gradient(var(--pink) 1px,transparent 1px),linear-gradient(90deg,var(--pink) 1px,transparent 1px);background-size:36px 24px;transform:perspective(200px) rotateX(55deg);transform-origin:bottom;animation:grid 1.2s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleX(0)}to{transform:none}}@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.4)}to{transform:scale(1)}}
@keyframes blink{50%{opacity:0}}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes grid{to{background-position:0 24px}}
.anim>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.anim>:nth-child(2){animation-delay:.08s}.anim>:nth-child(3){animation-delay:.16s}.anim>:nth-child(4){animation-delay:.24s}.anim>:nth-child(5){animation-delay:.32s}
.anim .bar i{transform-origin:left;animation:grow .9s .3s cubic-bezier(.2,.8,.2,1) both}.anim .step.done:before{animation:pop .45s .35s both}
@media(max-width:800px){.sidebar{position:static;width:100%}main{margin-left:0}.authbox{grid-template-columns:1fr}.hero{border-radius:14px 14px 0 0;border-right:2px solid var(--line)}.login{border-radius:0 0 14px 14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.toast{pointer-events:none}.icon-btn{color:var(--ink)}body{transition:background-color .3s,color .3s}
[data-theme=dark]{--bg:#150a30;--card:#241548;--ink:#f1ecff;--mute:#b3a6e0;--line:#7a62c9;color-scheme:dark}
[data-theme=dark] body{background-image:radial-gradient(#7a62c944 1px,transparent 1px)}
[data-theme=dark] .stat,[data-theme=dark] .slot,[data-theme=dark] .btn.ghost{background:var(--card)}
[data-theme=dark] .status,[data-theme=dark] .bar,[data-theme=dark] .demo{background:#150a30;color:var(--ink)}
[data-theme=dark] .step:before,[data-theme=dark] .progress{background:#3a2a6b}
[data-theme=dark] .btn,[data-theme=dark] .Medium,[data-theme=dark] .Low,[data-theme=dark] .nav button.active,[data-theme=dark] .avatar{color:#20114a}
[data-theme=dark] .btn.danger,[data-theme=dark] .High{color:#fff}[data-theme=dark] .btn.ghost,[data-theme=dark] .btn.ghost:hover{color:var(--ink)}.modal .btn.ghost{color:var(--ink)}
[data-theme=dark] .toast{background:#0f0724;color:#fff}[data-theme=dark] .sidebar,[data-theme=dark] .hero{border-color:var(--line)}
[data-theme=dark] a{color:var(--cyan)}[data-theme=dark] th,[data-theme=dark] td{border-bottom-color:#4a3a85}
.modal{position:fixed;inset:0;background:#150a30b3;display:grid;place-items:center;z-index:50;animation:fade .2s both}.modal .card{width:min(420px,calc(100% - 32px));margin:0;animation:rise .25s both}@keyframes fade{from{opacity:0}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const API=localStorage.getItem('cc_api')||'http://localhost:8000/api';
let token=localStorage.getItem('cc_token')||'';let me=JSON.parse(localStorage.getItem('cc_user')||'null');let page='dashboard';let cache={complaints:[],facilities:[],bookings:[],announcements:[],notifications:[],users:[],analytics:null};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('cc_theme',t)}catch(e){}const b=document.getElementById('themebtn');if(b)b.textContent=t==='dark'?'☀️ Light mode':'🌙 Dark mode'}
{const b=document.createElement('button');b.id='themebtn';b.className='icon-btn';b.setAttribute('aria-label','Toggle light and dark theme');b.style.cssText='position:fixed;right:22px;bottom:22px;z-index:30';b.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.documentElement.appendChild(b);let t;try{t=localStorage.getItem('cc_theme')}catch(e){}setTheme(t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}
function ask(title,text,ok){return new Promise(res=>{const o=document.createElement('div');o.className='modal';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.innerHTML=`<div class="card"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="actions" style="justify-content:flex-end"><button class="btn ghost" data-v="0">Cancel</button><button class="btn danger" data-v="1">${esc(ok)}</button></div></div>`;const k=e=>{if(e.key==='Escape')done(false)},done=v=>{document.removeEventListener('keydown',k);o.remove();res(v)};document.addEventListener('keydown',k);o.onclick=e=>{if(e.target===o)return done(false);const v=e.target.dataset&&e.target.dataset.v;if(v!==undefined)done(v==='1')};document.documentElement.appendChild(o);o.querySelector('[data-v="1"]').focus()})}
function logo(z){return`<svg width="${z}" height="${z}" viewBox="0 0 32 32" role="img" aria-label="CampusConnect logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa3"/><stop offset="1" stop-color="#ffc93c"/></linearGradient></defs><rect width="32" height="32" rx="7" fill="url(#lg)"/><g fill="#20114a"><rect x="14" y="5" width="4" height="2"/><rect x="10" y="7" width="12" height="2"/><rect x="6" y="9" width="20" height="2"/><rect x="10" y="11" width="12" height="2"/><rect x="14" y="13" width="4" height="2"/><rect x="9" y="16" width="14" height="7"/><rect x="25" y="11" width="2" height="9"/><rect x="24" y="20" width="4" height="3"/></g><rect x="11" y="18" width="10" height="2" fill="#2fd9ff"/></svg>`}
let _ak='';function afterRender(k){if(k===_ak)return;_ak=k;if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const a=document.querySelector('main')||document.querySelector('.authbox');if(!a)return;a.classList.add('anim');setTimeout(()=>a.classList.remove('anim'),1100);
a.querySelectorAll('.stat b').forEach(b=>{const n=+b.textContent;if(!n)return;let t=null;b.textContent=0;const f=ts=>{t=t||ts;const q=Math.min(1,(ts-t)/700);b.textContent=Math.round(n*(1-Math.pow(1-q,3)));if(q<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#email,#password,#name,#role,#dept')){e.preventDefault();$('name')?signup():login()}});
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.documentElement.appendChild(t)}t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2600)}
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;let r;try{r=await fetch(API+path,{...opt,headers:h})}catch(e){throw new Error('Cannot reach the backend. Start FastAPI at http://localhost:8000')}let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||'Request failed');return data}
function initials(n){return esc((n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}
function avatar(u,cls='avatar'){return u?.avatar?`<div class="${cls}"><img src="${u.avatar}" alt=""></div>`:`<div class="${cls}">${initials(u?.name)}</div>`}
function logout(){token='';me=null;localStorage.removeItem('cc_token');localStorage.removeItem('cc_user');renderAuth()}
function saveAuth(d){token=d.access_token;me=d.user;localStorage.setItem('cc_token',token);localStorage.setItem('cc_user',JSON.stringify(me));page='dashboard';renderApp()}
function renderAuth(mode='login'){document.body.innerHTML=`<div class="auth"><div class="authbox"><section class="hero">${logo(64)}<h1>CAMPUS<br>CONNECT</h1><p>Smart campus management with real complaint routing, facility booking, announcements and role-based workspaces.</p><ul><li>NLP complaint classification</li><li>JWT authentication</li><li>Database-backed workflows</li><li>Admin analytics</li></ul></section><section class="card login"><h2>${mode==='login'?'Sign in':'Create account'}</h2><p class="muted">${mode==='login'?'Use your campus account to continue.':'Create a student or teacher account.'}</p><div class="field"><label>Email</label><input id="email" type="email" value="${mode==='login'?'student@demo.com':''}"></div><div class="field"><label>Password</label><input id="password" type="password" value="${mode==='login'?'demo123':''}"></div>${mode==='signup'?`<div class="field"><label>Full name</label><input id="name"></div><div class="formgrid"><div class="field"><label>Role</label><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select></div><div class="field"><label>Department / course</label><input id="dept"></div></div>`:''}<button class="btn" style="width:100%" onclick="${mode==='login'?'login()':'signup()'}">${mode==='login'?'Sign in':'Create account'}</button><p class="small muted">${mode==='login'?`No account? <a href="#" onclick="renderAuth('signup');return false">Create one</a>`:`Already registered? <a href="#" onclick="renderAuth('login');return false">Sign in</a>`}</p>${mode==='login'?`<div class="demo"><b>Demo accounts</b><br>student@demo.com · teacher@demo.com · admin@demo.com<br>Password: demo123<br><br>Deactivated accounts can be reactivated when you sign in.</div>`:''}</section></div></div>`;afterRender('auth'+mode)}
async function login(){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});saveAuth(d)}catch(e){if(/deactivated/i.test(e.message)){if(await ask('Account is deactivated','Reactivate it and sign in?','Reactivate'))return reactivate();return}toast(e.message)}}
async function signup(){try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value,role:$('role').value,dept:$('dept').value})});saveAuth(d)}catch(e){toast(e.message)}}
async function reactivate(){try{const d=await api('/auth/reactivate',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});saveAuth(d);toast('Account reactivated')}catch(e){toast(e.message)}}
const nav={student:[['dashboard','🏠 Dashboard'],['report','📝 Report issue'],['book','📅 Facilities'],['notices','📢 Notices'],['notifications','🔔 Notifications'],['profile','👤 Profile']],teacher:[['dashboard','🏠 Overview'],['report','📝 Report issue'],['book','📅 Facilities'],['notices','📢 Notices'],['post','📣 Post notice'],['notifications','🔔 Notifications'],['profile','👤 Profile']],admin:[['dashboard','📊 Analytics'],['complaints','🗂 Complaints'],['users','👥 Users'],['notices','📢 Notices'],['post','📣 Post notice'],['notifications','🔔 Notifications'],['profile','👤 Profile']]};
async function load(){cache.complaints=await api('/complaints');cache.bookings=await api('/bookings');cache.facilities=await api('/facilities');cache.announcements=await api('/announcements');cache.notifications=await api('/notifications');if(me.role==='admin'){cache.users=await api('/admin/users');cache.analytics=await api('/admin/analytics')}}
function shell(content,title){const unread=cache.notifications.filter(n=>!n.read).length;return `<div class="shell"><aside class="sidebar"><div class="brand">${logo(36)}<span>CAMPUS<br>CONNECT</span></div><div class="user-mini">${avatar(me)}<div><b>${esc(me.name)}</b><br><span class="small">${esc(me.role)}</span></div></div><div class="nav">${nav[me.role].map(([k,l])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${l}${k==='notifications'&&unread?` <span class="notif-dot"></span>`:''}</button>`).join('')}</div><button class="nav logout" onclick="logout()">Log out</button></aside><main><div class="top"><div><h1>${title}</h1><div class="muted small">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div></div><button class="icon-btn" onclick="go('notifications')">🔔 ${unread?unread+' new':''}</button></div>${content}</main></div>`}
function go(p){page=p;renderApp()}
function stat(n,l){return `<div class="stat"><b>${n}</b><span>${l}</span></div>`}
function statusClass(s){return s==='Resolved'?'Low':s==='Rejected'?'High':'status'}
function timeline(c){const steps=['Submitted','Under Review','In Progress','Resolved'];let idx=steps.indexOf(c.status);if(c.status==='Rejected')idx=-1;return `<div class="timeline">${steps.map((s,i)=>`<div class="step ${i<=idx?'done':''}">${s}</div>`).join('')}</div>`}
function issue(c,staff=false){return `<div class="issue"><div class="row"><div><b>${esc(c.title)}</b><div class="small muted">${esc(c.ticket)} · ${esc(c.location)} · ${new Date(c.created_at).toLocaleString()}</div></div><div><span class="pill ${c.priority}">${c.priority}</span><span class="pill">${esc(c.category)}</span><span class="pill ${statusClass(c.status)}">${esc(c.status)}</span></div></div><p>${esc(c.description)}</p><div class="small muted">Routed to <b>${esc(c.department)}</b></div>${timeline(c)}${staff?`<div class="actions" style="margin-top:10px">${['Under Review','In Progress','Resolved','Rejected'].filter(s=>s!==c.status).map(s=>`<button class="btn ${s==='Rejected'?'danger':'secondary'}" onclick="changeStatus(${c.id},'${s}')">${s}</button>`).join('')}</div>`:''}</div>`}
async function dashboard(){const c=cache.complaints;const open=c.filter(x=>!['Resolved','Rejected'].includes(x.status)).length;const high=c.filter(x=>x.priority==='High').length;const booked=cache.bookings.length;let body;if(me.role==='admin'){const a=cache.analytics;body=`<div class="grid">${stat(a.total_complaints,'Total complaints')}${stat(a.open_complaints,'Open complaints')}${stat(a.resolved,'Resolved')}${stat(a.high_priority,'High priority')}${stat(a.active_users,'Active users')}</div><div class="two" style="margin-top:18px"><div class="card"><h2>Complaint categories</h2>${(a.categories||[]).map(x=>`<div style="margin:12px 0"><div class="row"><span>${esc(x.name)}</span><b>${x.count}</b></div><div class="bar"><i style="width:${a.total_complaints?x.count/a.total_complaints*100:0}%"></i></div></div>`).join('')||'<div class="empty">No complaint data yet.</div>'}</div><div class="card"><h2>By department</h2>${(a.departments||[]).map(x=>`<p><b>${esc(x.name)}</b> <span class="muted">${x.count}</span></p>`).join('')||'<div class="empty">No data yet.</div>'}</div></div><div class="card"><h2>Latest complaints</h2>${c.slice(0,5).map(x=>issue(x,true)).join('')||'<div class="empty">No complaints yet.</div>'}</div>`}else{body=`<div class="grid">${stat(c.length,me.role==='student'?'My complaints':'All complaints')}${stat(open,'Open')}${stat(high,'High priority')}${stat(booked,'My bookings')}</div><div class="card" style="margin-top:18px"><div class="row"><h2>${me.role==='student'?'My latest issues':'Campus issue queue'}</h2><button class="btn" onclick="go('report')">Report issue</button></div>${c.slice(0,6).map(x=>issue(x,me.role==='teacher')).join('')||'<div class="empty">No complaints yet.</div>'}</div><div class="card"><h2>Latest notices</h2>${cache.announcements.slice(0,3).map(n=>`<div class="notice" style="padding:10px;margin:8px 0"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><span class="small muted">${esc(n.author)}</span></div>`).join('')||'<div class="empty">No notices yet.</div>'}</div>`}return body}
function report(){return `<div class="card"><h2>Report a campus issue</h2><p class="muted">Describe the problem clearly. The NLP model predicts the category and the backend assigns priority and department.</p><div class="field"><label>Issue title</label><input id="ctitle" placeholder="e.g. WiFi is not working in hostel block B" oninput="predict()"></div><div class="field"><label>Location</label><input id="cloc" placeholder="e.g. Hostel Block B"></div><div class="field"><label>Description</label><textarea id="cdesc" rows="5" placeholder="Explain what happened, where, and any useful details..." oninput="predict()"></textarea></div><div id="ai" class="ai">Start typing to see the ML classification.</div><br><button class="btn" onclick="submitComplaint()">Submit & route issue</button></div>`}
let lastPred=null;let predTimer;
async function predict(){clearTimeout(predTimer);predTimer=setTimeout(async()=>{const title=$('ctitle').value.trim(),description=$('cdesc').value.trim();if((title+' '+description).length<8)return;$('ai').innerHTML='<span class="muted">Running classifier…</span>';try{lastPred=await api('/classify',{method:'POST',body:JSON.stringify({title,description,location:$('cloc').value||'Campus'})});$('ai').innerHTML=`<b>${esc(lastPred.category)}</b> <span class="pill ${lastPred.priority}">${lastPred.priority} priority</span><br>Department: <b>${esc(lastPred.department)}</b><div class="bar" style="margin-top:9px"><i style="width:${lastPred.confidence*100}%"></i></div><span class="small muted">Model confidence: ${Math.round(lastPred.confidence*100)}%</span>`}catch(e){$('ai').innerHTML=`<span style="color:var(--red)">${esc(e.message)}</span>`}},350)}
async function submitComplaint(){try{const d=await api('/complaints',{method:'POST',body:JSON.stringify({title:$('ctitle').value,description:$('cdesc').value,location:$('cloc').value||'Campus'})});toast(`Submitted ${d.ticket} → ${d.department}`);await refresh();page='dashboard';renderApp()}catch(e){toast(e.message)}}
async function changeStatus(id,s){try{await api('/complaints/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:s,comment:'Updated from CampusConnect dashboard.'})});toast('Complaint updated');await refresh();renderApp()}catch(e){toast(e.message)}}
function facilities(){const dates=[new Date().toISOString().slice(0,10),new Date(Date.now()+86400000).toISOString().slice(0,10)];return `<div class="card"><h2>Facility booking</h2><div class="formgrid"><div class="field"><label>Facility</label><select id="fid">${cache.facilities.map(f=>`<option value="${f.id}">${esc(f.name)} · ${f.capacity} seats</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="bdate" type="date" value="${dates[0]}" min="${dates[0]}"></div></div><div class="field"><label>Purpose</label><input id="purpose" value="Campus activity"></div><h3>Available time slots</h3><div class="slot-grid">${['09:00','10:00','11:00','12:00','14:00','16:00'].map(s=>`<button class="slot" onclick="bookSlot('${s}')">${s}</button>`).join('')}</div></div><div class="card"><h2>${me.role==='student'?'My bookings':'Campus bookings'}</h2>${cache.bookings.map(b=>`<div class="row" style="padding:10px 0;border-bottom:1px dashed #aaa0c9"><div><b>${esc(b.facility)}</b><br><span class="small muted">${b.date} · ${b.slot} · ${esc(b.purpose)}</span></div><button class="icon-btn" onclick="cancelBooking(${b.id})">Cancel</button></div>`).join('')||'<div class="empty">No bookings yet.</div>'}</div>`}
async function bookSlot(slot){try{await api('/bookings',{method:'POST',body:JSON.stringify({facility_id:+$('fid').value,booking_date:$('bdate').value,slot,purpose:$('purpose').value||'Campus activity'})});toast('Booking confirmed');await refresh();renderApp()}catch(e){toast(e.message)}}
async function cancelBooking(id){try{await api('/bookings/'+id,{method:'DELETE'});toast('Booking cancelled');await refresh();renderApp()}catch(e){toast(e.message)}}
function notices(){return `<div class="card"><h2>Campus notices</h2>${cache.announcements.map(n=>`<div class="notice" style="padding:13px;margin:10px 0"><div class="row"><b>${esc(n.title)}</b><span class="pill">${esc(n.audience)}</span></div><p>${esc(n.body)}</p><small class="muted">Posted by ${esc(n.author)} · ${new Date(n.created_at).toLocaleString()}</small></div>`).join('')||'<div class="empty">No notices published.</div>'}</div>`}
function post(){return `<div class="card"><h2>Publish announcement</h2><div class="field"><label>Title</label><input id="ntitle"></div><div class="field"><label>Message</label><textarea id="nbody" rows="5"></textarea></div><div class="formgrid"><div class="field"><label>Audience</label><select id="naud"><option value="all">Everyone</option><option value="students">Students</option><option value="teachers">Teachers</option></select></div></div><button class="btn" onclick="postNotice()">Publish & notify</button></div>`}
async function postNotice(){try{await api('/announcements',{method:'POST',body:JSON.stringify({title:$('ntitle').value,body:$('nbody').value,audience:$('naud').value})});toast('Announcement published');await refresh();page='notices';renderApp()}catch(e){toast(e.message)}}
function notifications(){return `<div class="card"><div class="row"><h2>Notifications</h2><button class="btn secondary" onclick="readAll()">Mark all read</button></div>${cache.notifications.map(n=>`<div style="padding:12px 0;border-bottom:1px dashed #aaa0c9;opacity:${n.read?.65:1}"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small class="muted">${new Date(n.created_at).toLocaleString()}</small></div>`).join('')||'<div class="empty">You are all caught up.</div>'}</div>`}
async function readAll(){try{await api('/notifications/read-all',{method:'POST'});await refresh();renderApp()}catch(e){toast(e.message)}}
function users(){return `<div class="card"><h2>User management</h2><table><tr><th>User</th><th>Role</th><th>Department</th><th>Status</th><th>Actions</th></tr>${cache.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="small muted">${esc(u.email)}</span></td><td>${u.role}</td><td>${esc(u.dept||'-')}</td><td>${u.active?'Active':'Inactive'}</td><td>${u.id===me.id?'You':`<button class="icon-btn" onclick="toggleUser(${u.id})">${u.active?'Deactivate':'Reactivate'}</button> <button class="icon-btn" onclick="deleteUser(${u.id})">Delete</button>`}</td></tr>`).join('')}</table></div>`}
async function toggleUser(id){try{await api('/admin/users/'+id+'/active',{method:'PATCH'});await refresh();renderApp();toast('User status updated')}catch(e){toast(e.message)}}
async function deleteUser(id){if(!await ask('Delete this user?','This permanently removes the user along with their complaints and bookings.','Delete user'))return;try{await api('/admin/users/'+id,{method:'DELETE'});await refresh();renderApp();toast('User deleted')}catch(e){toast(e.message)}}
function complaintsPage(){return `<div class="card"><div class="row"><h2>Complaint queue</h2><span class="pill">${cache.complaints.length} records</span></div>${cache.complaints.map(c=>issue(c,true)).join('')||'<div class="empty">No complaints yet.</div>'}</div>`}
function profile(){const fields=[me.avatar,me.phone,me.location,me.website,me.bio,me.dept];const pct=Math.round(fields.filter(Boolean).length/fields.length*100);return `<div class="card profile-head">${avatar(me)}<div style="flex:1"><h2 style="margin:0">${esc(me.name)}</h2><div class="muted">${esc(me.email)} · ${esc(me.role)}</div><span class="pill">${esc(me.dept||'Add department')}</span></div><div style="min-width:160px"><span class="small muted">Profile ${pct}% complete</span><div class="progress"><i style="width:${pct}%"></i></div></div></div><div class="card"><h2>Edit profile</h2><div class="formgrid"><div class="field"><label>Name</label><input id="pn" value="${esc(me.name)}"></div><div class="field"><label>Department</label><input id="pd" value="${esc(me.dept||'')}"></div><div class="field"><label>Phone</label><input id="pphone" value="${esc(me.phone||'')}"></div><div class="field"><label>Location</label><input id="ploc" value="${esc(me.location||'')}"></div><div class="field"><label>Website / LinkedIn</label><input id="pweb" value="${esc(me.website||'')}"></div><div class="field"><label>New password</label><input id="pnew" type="password" placeholder="Leave blank to keep current"></div></div><div class="field"><label>Bio</label><textarea id="pbio" rows="4" maxlength="500">${esc(me.bio||'')}</textarea></div><div class="field"><label>Profile image</label><input id="pavatar" type="file" accept="image/*" onchange="avatarFile(this)"></div><button class="btn" onclick="saveProfile()">Save profile</button></div><div class="card"><h2>Account controls</h2><p class="muted">Deactivate temporarily or permanently delete your account and associated records.</p><div class="actions"><button class="btn warning" onclick="deactivate()">Deactivate account</button><button class="btn danger" onclick="deleteMe()">Delete account</button></div></div>`}
let newAvatar='';function avatarFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const side=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,160,160);newAvatar=c.toDataURL('image/jpeg',.82)};img.src=r.result};r.readAsDataURL(f)}
async function saveProfile(){try{const d=await api('/me',{method:'PATCH',body:JSON.stringify({name:$('pn').value,dept:$('pd').value,phone:$('pphone').value,location:$('ploc').value,website:$('pweb').value,bio:$('pbio').value,avatar:newAvatar||me.avatar||'',new_password:$('pnew').value||null})});me=d;localStorage.setItem('cc_user',JSON.stringify(me));newAvatar='';toast('Profile saved');renderApp()}catch(e){toast(e.message)}}
async function deactivate(){if(!await ask('Deactivate your account?','You will be signed out. Sign in again any time to reactivate it.','Deactivate'))return;try{await api('/me/deactivate',{method:'POST'});logout();toast('Account deactivated')}catch(e){toast(e.message)}}
async function deleteMe(){if(!await ask('Delete your account?','This permanently removes your account, complaints and bookings. It cannot be undone.','Delete account'))return;try{await api('/me',{method:'DELETE'});logout();toast('Account deleted')}catch(e){toast(e.message)}}
async function refresh(){cache=Object.assign(cache,{complaints:await api('/complaints'),bookings:await api('/bookings'),facilities:await api('/facilities'),announcements:await api('/announcements'),notifications:await api('/notifications')});if(me.role==='admin'){cache.users=await api('/admin/users');cache.analytics=await api('/admin/analytics')}}
async function renderApp(){if(!token||!me){renderAuth();return}const rid=window._rid=(window._rid||0)+1;if(!document.querySelector('.shell'))document.body.innerHTML='<div class="card" style="margin:40px auto;max-width:500px">Loading CampusConnect…</div>';try{await refresh();const titles={dashboard:me.role==='admin'?'Campus analytics':me.role==='teacher'?'Campus overview':'My dashboard',report:'Report issue',book:'Facilities & bookings',notices:'Campus notices',post:'Post announcement',notifications:'Notifications',profile:'My profile',users:'User management',complaints:'Complaint queue'};let content=page==='dashboard'?await dashboard():page==='report'?report():page==='book'?facilities():page==='notices'?notices():page==='post'?post():page==='notifications'?notifications():page==='profile'?profile():page==='users'?users():complaintsPage();if(rid!==window._rid)return;document.body.innerHTML=shell(content,titles[page]||'CampusConnect');afterRender('app|'+me.id+'|'+page)}catch(e){document.body.innerHTML=`<div class="card" style="margin:40px auto;max-width:600px"><h2>Backend connection needed</h2><p>${esc(e.message)}</p><p class="muted">Start the FastAPI server from the project root with <code>uvicorn backend.main:app --reload</code>.</p><button class="btn" onclick="renderApp()">Retry</button></div>`}}
if(token&&me)renderApp();else renderAuth();
</script></body></html>
